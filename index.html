});
maze.addEventListener('pointermove',e=>{
 if(!drag)return;
 let p=pos(e);
 // 不再做牆壁碰撞判斷：滑鼠移到哪裡，筆跡就畫到哪裡。
 points.push(p);
 redraw();

 // 只有游標真正進入「正確答案」的外圍答案框才過關。
 // 經過任何錯誤答案完全不判錯、不停止、不提示。
 let correctIndex=currentOpts.indexOf(P[idx].ans);
 let answerEl=document.querySelector('.answer.a'+correctIndex);
 if(answerEl){
   let ar=answerEl.getBoundingClientRect();
   if(e.clientX>=ar.left && e.clientX<=ar.right &&
      e.clientY>=ar.top && e.clientY<=ar.bottom){
      drag=false;
      try{ if(maze.hasPointerCapture(e.pointerId)) maze.releasePointerCapture(e.pointerId); }catch(err){}
      $('status').textContent=`🎉 找到 ${P[idx].ans}，答對！準備下一題…`;
      setTimeout(()=>{
        if(idx<P.length-1){idx++;render();requestAnimationFrame(drawAll);}
        else{$('status').textContent='🏆 恭喜！10 題進位加法全部完成！';}
      },700);
   }
 }
});
maze.addEventListener('pointerup',e=>{
 drag=false;
 try{ if(maze.hasPointerCapture(e.pointerId)) maze.releasePointerCapture(e.pointerId); }catch(err){}
});
maze.addEventListener('pointercancel',e=>{
 drag=false;
 try{ if(maze.hasPointerCapture(e.pointerId)) maze.releasePointerCapture(e.pointerId); }catch(err){}
});
$('restart').addEventListener('click',()=>{drag=false;last=null;points=[];redraw();$('status').textContent='筆跡已清除，從 START 再走一次。'});

addEventListener('resize',drawAll);render();
</script></body></html>
